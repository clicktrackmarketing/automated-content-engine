<!doctype html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-bg: #12284D;
      --brand-accent: #18C0E7;
      --brand-cta: #FE6601;
      --brand-positive: #61CE70;
      --brand-text: #FFFFFF;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Montserrat', 'Inter', 'Poppins', sans-serif;
    }
    .caption-container {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 80%;
    }
    .caption-word {
      display: inline-block;
      font-size: 42px;
      font-weight: 600;
      color: var(--brand-text);
      text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(0,0,0,0.3);
      margin: 0 6px;
      opacity: 0;
      transform: translateY(10px);
    }
    .caption-word.active {
      color: var(--brand-accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!--
    USAGE: This template is driven by a transcript.json file.
    Replace the words below with your transcript content.
    Each word gets data-start and data-duration from the transcript.

    Active word highlight uses the brand accent color (--brand-accent).
    Font: Montserrat SemiBold (600) for normal, Bold (700) for active.

    transcript.json format:
    {
      "words": [
        { "word": "Hello", "start": 0.0, "duration": 0.4 },
        { "word": "world", "start": 0.5, "duration": 0.3 }
      ]
    }
  -->
  <div
    id="root"
    data-composition-id="captions"
    data-start="0"
    data-duration="10"
    data-width="1920"
    data-height="1080"
  >
    <div class="caption-container" id="caption-container">
      <span class="caption-word" id="w0">Hello</span>
      <span class="caption-word" id="w1">world,</span>
      <span class="caption-word" id="w2">this</span>
      <span class="caption-word" id="w3">is</span>
      <span class="caption-word" id="w4">a</span>
      <span class="caption-word" id="w5">caption</span>
      <span class="caption-word" id="w6">demo.</span>
    </div>
  </div>

  <script>
    // Example transcript timing. Replace with actual transcript.json data.
    const words = [
      { id: "w0", start: 0.0, dur: 0.4 },
      { id: "w1", start: 0.5, dur: 0.3 },
      { id: "w2", start: 1.0, dur: 0.2 },
      { id: "w3", start: 1.3, dur: 0.15 },
      { id: "w4", start: 1.5, dur: 0.1 },
      { id: "w5", start: 1.7, dur: 0.5 },
      { id: "w6", start: 2.3, dur: 0.4 },
    ];

    // Read brand accent from CSS custom property
    const accentColor = getComputedStyle(document.documentElement)
      .getPropertyValue('--brand-accent').trim() || '#18C0E7';
    const textColor = getComputedStyle(document.documentElement)
      .getPropertyValue('--brand-text').trim() || '#FFFFFF';

    const tl = gsap.timeline({ paused: true });

    words.forEach((w) => {
      // Fade in word
      tl.to(`#${w.id}`, {
        opacity: 1,
        y: 0,
        duration: 0.1,
        ease: "power2.out"
      }, w.start);

      // Highlight active word in brand accent
      tl.to(`#${w.id}`, {
        color: accentColor,
        fontWeight: 700,
        duration: 0.05
      }, w.start);

      // Remove highlight after duration
      tl.to(`#${w.id}`, {
        color: textColor,
        fontWeight: 600,
        duration: 0.05
      }, w.start + w.dur);
    });

    window.__timelines = window.__timelines || {};
    window.__timelines["captions"] = tl;
  </script>
</body>
</html>
