<!doctype html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-bg: #12284D;
      --brand-accent: #18C0E7;
      --brand-cta: #FE6601;
      --brand-positive: #61CE70;
      --brand-text: #FFFFFF;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Montserrat', 'Inter', 'Poppins', sans-serif;
    }
    .title-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px;
    }
    .title-bg {
      position: absolute;
      inset: 0;
      /* Uses brand-bg with transparency for overlay effect */
      background: linear-gradient(180deg, rgba(18,40,77,0.7) 0%, rgba(18,40,77,0.4) 50%, rgba(18,40,77,0.7) 100%);
      opacity: 0;
    }
    .title-badge {
      position: relative;
      z-index: 1;
      background: var(--brand-accent);
      color: var(--brand-bg);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 10px 28px;
      border-radius: 4px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(-20px);
    }
    .title-main {
      position: relative;
      z-index: 1;
      font-size: 72px;
      font-weight: 800;
      color: var(--brand-text);
      letter-spacing: -1px;
      line-height: 1.1;
      opacity: 0;
      transform: translateY(40px);
      text-shadow: 0 2px 20px rgba(0,0,0,0.4);
      max-width: 900px;
    }
    .title-sub {
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      margin-top: 20px;
      opacity: 0;
      transform: translateY(30px);
      text-shadow: 0 1px 10px rgba(0,0,0,0.3);
    }
    .title-line {
      position: relative;
      z-index: 1;
      width: 60px;
      height: 4px;
      background: var(--brand-accent);
      border-radius: 2px;
      margin-top: 24px;
      opacity: 0;
      transform: scaleX(0);
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="title-card"
    data-start="0"
    data-duration="4"
    data-width="1920"
    data-height="1080"
  >
    <div class="title-container">
      <div class="title-bg" id="title-bg"></div>
      <div class="title-badge" id="title-badge">CATEGORY</div>
      <div class="title-main" id="title-main">Your Title Here</div>
      <div class="title-sub" id="title-sub">Your Brand Name</div>
      <div class="title-line" id="title-line"></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.to("#title-bg", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
    tl.to("#title-badge", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
    tl.to("#title-main", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.4);
    tl.to("#title-sub", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.8);
    tl.to("#title-line", { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.0);

    tl.to("#title-badge", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, 3.0);
    tl.to("#title-main", { opacity: 0, y: -15, duration: 0.4, ease: "power2.in" }, 3.1);
    tl.to("#title-sub", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, 3.2);
    tl.to("#title-line", { opacity: 0, duration: 0.2 }, 3.3);
    tl.to("#title-bg", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.3);

    window.__timelines = window.__timelines || {};
    window.__timelines["title-card"] = tl;
  </script>
</body>
</html>
